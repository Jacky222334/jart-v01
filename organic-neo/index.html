<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organic Neo — galaxie</title>
  <meta name="theme-color" content="#000000">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000;
    }
    canvas {
      display: block; width: 100vw; height: 100vh;
      image-rendering: pixelated;
    }
    #overlay { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
    #title {
      position: absolute; top: 1.2rem; left: 1.4rem;
      font-family: "SF Mono", Consolas, monospace;
      font-size: 0.62rem; letter-spacing: 0.24em; text-transform: uppercase;
      color: #ff00ea;
      text-shadow: 0 0 12px #ff00ea, 0 0 24px #00ffff;
    }
    #hint {
      position: absolute; bottom: 1.2rem; right: 1.4rem;
      font-family: "SF Mono", Consolas, monospace;
      font-size: 0.55rem; letter-spacing: 0.1em;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
    }
  </style>
</head>
<body>
  <canvas aria-label="Organic Neo Symbol Animation"></canvas>
  <div id="overlay">
    <div id="title">◉ organic neo · galaxie</div>
    <div id="hint">s · speichern · klick · pause</div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
