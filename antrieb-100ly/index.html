<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Antrieb 100LY · Alle Systeme · Südorbit</title>
  <meta name="theme-color" content="#000010">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000010;
      font-family: "SF Mono", ui-monospace, Consolas, monospace;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      cursor: crosshair;
    }
    #hint {
      position: fixed;
      right: max(0.5rem, var(--sar));
      bottom: max(0.35rem, var(--sab));
      color: #334;
      font-size: 9px;
      pointer-events: none;
      letter-spacing: 0.02em;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #hint.visible { opacity: 1; }
    @media (max-width: 430px), (max-height: 430px) {
      #hint { font-size: 8px; }
    }
  </style>
</head>
<body>
  <canvas aria-label="Antrieb 100 Lichtjahre Raketensysteme"></canvas>
  <div id="hint">tippen · pause</div>
  <script type="module" src="app.js"></script>
</body>
</html>
