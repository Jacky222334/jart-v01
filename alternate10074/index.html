.x,a[6].y),vec2((a[6].x+a[6].z),(a[6].y+a[6].w)))>=1.){cb=hs(cb,.1667);}if(ib(p,vec2(a[7].x,a[7].y),vec2((a[7].x+a[7].z),(a[7].y+a[7].w)))>=1.){cb=vec3(0.);}col=vec4(cb,1.);}";dSha="uniform sampler2D buf;in vec2 vUv;out vec4 col;void main(){col=texture(buf,vec2(vUv.x,1.-vUv.y));}";document.querySelector("html").style.height="100%";let bs=document.body.style;bs.margin=0;bs.height="100%";bs.overflow="hidden";bs.background="black";cvs=document.createElement("canvas");cvs.style.width=cvs.style.height="100%";cvs.style.verticalAlign="bottom";document.body.append(cvs);gl=cvs.getContext("webgl2");gl.drawingBufferColorSpace="display-p3";gl.unpackColorSpace="display-p3";gl.disable(gl.BLEND);gl.disable(gl.DEPTH_TEST);gl.clearColor(0,0,0,1);vBuf=createBuf([-1,1,0,-1,-1,0,1,1,0,1,-1,0]);fPro=createPro(vSha,fSha);dPro=createPro(vSha,dSha);setup();animate()}function setup(){scl=Math.min(window.devicePixelRatio,2);width=cvs.clientWidth;height=cvs.clientHeight;cvs.width=width*scl;cvs.height=height*scl;rnd=mb32(seed);for(let fbo in fbos){gl.deleteFramebuffer(fbo.fbo);gl.deleteTexture(fbo.texture)}let p=createPixels(width,height);img=createTex(width,height,p);fbos=[];fbos.push(createFbo(width,height,p));fbos.push(createFbo(width,height,null));fboId=0;setupAnims()}function animate(){renderF();renderD();updateAnims();requestAnimationFrame(animate)}function setupPro(p){gl.useProgram(p);p.vertexPosAttrib=gl.getAttribLocation(p,"pos");gl.enableVertexAttribArray(p.vertexPosAttrib);gl.bindBuffer(gl.ARRAY_BUFFER,vBuf);gl.vertexAttribPointer(p.vertexPosAttrib,3,gl.FLOAT,false,0,0)}function renderF(){let prevId=fboId;let curId=fboId^=1;setupPro(fPro);gl.bindFramebuffer(gl.FRAMEBUFFER,fbos[curId].fbo);gl.viewport(0,0,width,height);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.activeTexture(gl.TEXTURE0+prevId);gl.bindTexture(gl.TEXTURE_2D,fbos[prevId].tex);gl.activeTexture(gl.TEXTURE0+2);gl.bindTexture(gl.TEXTURE_2D,img);gl.uniform2f(gl.getUniformLocation(fPro,"dims"),width,height);gl.unif floor(rnd()*13)},()=>m+floor(rnd()*(h-2*m)));vs.sort((a,b)=>{return a-b});for(let i=0;i<=vs.length;i++){let x=m;let y=i==0?m:vs[i-1];let cw=w-2*m;let rh=i==vs.length?h-m-y:vs[i]-y;let cc=i<c.length?c[i]:c[floor(rnd()*c.length)];if(rnd()<.5)drawLines(uint8,x,y,cw,rh,cc);else drawRect(uint8,x,y,cw,rh,cc);rs[i]=[x,y,cw,rh]}}else{let cols=1+ceil(rnd()*3);let rows=4-cols+ceil(rnd()*4);let cw=floor((w-2*m)/cols);let rh=floor((h-2*m)/rows);for(let x=0;x<cols;x++){for(let y=0;y<rows;y++){let i=floor(x+y*cols);let px=x*cw+m;let py=y*rh+m;let cc=i<c.length?c[i]:c[floor(rnd()*c.length)];if(rnd()<.5)drawLines(uint8,px,py,cw,rh,cc);else drawRect(uint8,px,py,cw,rh,cc);rs[i]=[px,py,cw,rh]}}}return uint8}function drawLines(uint8,x,y,w,h,c){let d=pow(2,2+floor(rnd()*2));let s=ceil(rnd()*(d-1));for(let i=0;i<h;i+=d){drawRect(uint8,x,y+i,w,s,c)}}function drawRect(uint8,x,y,w,h,c){for(let i=0;i<w;i++){for(let j=0;j<h;j++){let idx=x+i+(y+j)*width;setPixel(uint8,idx,c)}}}function setPixel(uint8,i,c){uint8[i*4]=c[0];uint8[i*4+1]=c[1];uint8[i*4+2]=c[2];uint8[i*4+3]=255}function setupAnims(){as=[];cs=[];for(let i=0;i<8;i++){setupAnim(i)}}function setupAnim(i){if(i<4){let w=ceil(width*rnd());let h=ceil(height*rnd());let x=floor((width-w)*rnd());let y=floor((height-h)*rnd());as[i]=[x,y,w,h];cs[i]=ceil(rnd()*15)*20}else{let r=rs[floor(rnd()*rs.length)];as[i]=[r[0],r[1],2,r[3]];cs[i]=r[2]}}function updateAnims(){for(let i=0;i<8;i++){cs[i]--;if(i>3){as[i][0]+=2;cs[i]--}if(cs[i]<=0){setupAnim(i)}}}window.onload=init;window.onresize=setup;</script></body></html>
