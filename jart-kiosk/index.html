<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jart Kiosk · jbs3123</title>
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="kiosk.css">
</head>
<body>
  <div id="root">
    <div id="stage">
      <div id="frame-wrap">
        <iframe id="art" title="jart animation" allow="autoplay; serial"></iframe>
      </div>
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
      <div id="rim"></div>
    </div>
  </div>
  <div id="hud">
    <div id="piece-num" aria-hidden="true">01</div>
    <div id="title"></div>
    <div id="meta"></div>
    <a id="gallery-link" href="/uebersicht/">Übersicht</a>
    <div id="bar"></div>
  </div>
  <script type="module">
    import { PIECES, SLIDE_MS } from './manifest.js';
    import { initKiosk } from './kiosk-app.js';
    import { COSMIC_MUSIC } from './cosmic-music.js';
    const params = new URLSearchParams(location.search);
    const musicVol = parseFloat(params.get('musicvol') ?? '1');
    initKiosk({
      pieces: PIECES,
      slideMs: SLIDE_MS,
      shuffle: true,
      showGallery: true,
      music: params.get('music') === '1',
      musicPlaylist: COSMIC_MUSIC,
      musicVolume: Number.isFinite(musicVol) ? musicVol : 1,
    });
  </script>
</body>
</html>
