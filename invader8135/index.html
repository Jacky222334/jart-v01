<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invader 19 (Jellyfish) — homage</title>
  <meta name="description" content="Scanline-Glitch-Animation inspiriert von nbswwit">
  <meta name="theme-color" content="#dddddd">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #ddd;
      font-family: "SF Mono", "Consolas", monospace;
    }
    canvas {
      display: block;
      width: 100vw; height: 100vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 2;
    }
    #title {
      position: absolute; top: 1.2rem; left: 1.4rem;
      font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(30, 38, 51, 0.55);
      opacity: 0; animation: in 2s ease 0.5s forwards;
    }
    #title span { opacity: 0.65; }
    #hint {
      position: absolute; bottom: 1.2rem; right: 1.4rem;
      font-size: 0.58rem; letter-spacing: 0.1em;
      color: rgba(30, 38, 51, 0.35);
      opacity: 0; animation: in 2s ease 2s forwards;
    }
    @keyframes in { to { opacity: 1; } }
  </style>
</head>
<body>
  <canvas aria-label="Invader 19 Jellyfish"></canvas>
  <div id="overlay">
    <div id="title">invader 19 <span>· jellyfish · nbswwit</span></div>
    <div id="hint">s · speichern · klick · pause</div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
