<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Impression IV — homage</title>
  <meta name="description" content="Verschwommenes Farbfeld — Hommage an MCHX">
  <meta name="theme-color" content="#030303">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #030303;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    #overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 2;
      mix-blend-mode: difference; color: rgba(255, 255, 255, 0.55);
    }
    #title {
      position: absolute; top: 1.2rem; left: 1.4rem;
      font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase;
      opacity: 0; animation: in 2s ease 0.5s forwards;
    }
    #title span { opacity: 0.65; }
    #hint {
      position: absolute; bottom: 1.2rem; right: 1.4rem;
      font-size: 0.58rem; letter-spacing: 0.1em;
      opacity: 0; animation: in 2s ease 2s forwards;
    }
    @keyframes in { to { opacity: 1; } }
  </style>
</head>
<body>
  <canvas aria-label="Night Impression IV"></canvas>
  <div id="overlay">
    <div id="title">night impression iv <span>· mchx</span></div>
    <div id="hint">s · speichern · klick · pause</div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
