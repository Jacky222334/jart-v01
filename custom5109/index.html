<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>custom5109 · Spotify</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <button id="audio-btn" type="button">Spotify hören</button>
    <div id="status">idle · klick für Spotify</div>
    <div id="meters" aria-hidden="true">
      <div class="m"><span>bass</span><i id="m-bass"></i></div>
      <div class="m"><span>mid</span><i id="m-mid"></i></div>
      <div class="m"><span>treble</span><i id="m-treble"></i></div>
    </div>
  </div>
  <aside id="tip">
    <strong>Mac-Mikrofon</strong>
    <ol>
      <li>Spotify abspielen (Lautsprecher an)</li>
      <li><em>Spotify hören</em> → Mikrofon erlauben</li>
      <li>Nutzt automatisch das Built-in Mic</li>
    </ol>
    <p class="hint">Systemeinstellungen → Datenschutz → Mikrofon → Browser erlauben.</p>
    <p class="hint">Leertaste / Klick = Pause · A = Audio</p>
  </aside>
  <script type="module" src="app.js"></script>
</body>
</html>
