name: Deploy Railway

on:
  push:
    branches: [main]

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --check server.js
      - run: node --check antrieb-100ly/sketch.js
      - run: node --check antrieb-100ly/hailmary.js
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then echo "Skip deploy — RAILWAY_TOKEN nicht gesetzt"; exit 0; fi
          npm install -g @railway/cli
          railway up --detach --service jart-v01
