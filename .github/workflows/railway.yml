name: Deploy Railway

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check server.js
      - run: node --check antrieb-100ly/sketch.js
      - run: node --check antrieb-100ly/hailmary.js
