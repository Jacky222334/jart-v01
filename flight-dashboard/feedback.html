<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Feedback Board · anonym</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #eef6f1;
      --muted: #8aa198;
      --ok: #3dcf7a;
      --line: rgba(180, 230, 210, 0.22);
      --accent: #5ee0c8;
      --pink: #ff6bb5;
      --yellow: #ffe08a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      background:
        radial-gradient(600px 380px at 10% -5%, #2a1a3a 0%, transparent 55%),
        radial-gradient(520px 340px at 100% 0%, #1a3a30 0%, transparent 50%),
        linear-gradient(160deg, #0a1210, #141c22 55%, #1a1420);
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: max(1rem, env(safe-area-inset-top)) 1rem calc(2rem + env(safe-area-inset-bottom));
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
    }
    h1 {
      margin: 0;
      font-family: Syne, sans-serif;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
    }
    .top a { color: var(--accent); font-size: 0.72rem; text-decoration: none; }
    .lead {
      margin: 0.45rem 0 1rem;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .anon-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--yellow);
      border: 1px dashed rgba(255, 224, 138, 0.45);
      padding: 0.25rem 0.5rem;
      margin-bottom: 0.85rem;
    }
    .targets {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.4rem;
      margin-bottom: 0.9rem;
    }
    .targets button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(8, 14, 16, 0.7);
      color: var(--ink);
      font: inherit;
      padding: 0.55rem 0.35rem;
      cursor: pointer;
      text-align: center;
    }
    .targets button b { display: block; font-size: 0.78rem; }
    .targets button span { display: block; font-size: 0.58rem; color: var(--muted); margin-top: 0.1rem; }
    .targets button.is-on {
      border-color: rgba(255, 107, 181, 0.65);
      background: rgba(255, 107, 181, 0.12);
      box-shadow: 0 0 0 1px rgba(255, 107, 181, 0.25);
    }
    .targets button[data-target="TEAM"].is-on {
      border-color: rgba(94, 224, 200, 0.65);
      background: rgba(94, 224, 200, 0.12);
      box-shadow: 0 0 0 1px rgba(94, 224, 200, 0.25);
    }
    label {
      display: grid;
      gap: 0.28rem;
      margin-bottom: 0.7rem;
      font-size: 0.65rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
    }
    textarea, select {
      width: 100%;
      font: inherit;
      font-size: 1rem;
      color: var(--ink);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--line);
      padding: 0.7rem 0.75rem;
      text-transform: none;
      letter-spacing: 0;
    }
    textarea { min-height: 7.5rem; resize: vertical; line-height: 1.4; }
    .emoji-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin: 0.2rem 0 0.85rem;
    }
    .emoji-bar button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(10, 16, 18, 0.85);
      font-size: 1.25rem;
      width: 2.35rem;
      height: 2.35rem;
      cursor: pointer;
      line-height: 1;
      padding: 0;
    }
    .emoji-bar button:active { transform: scale(1.08); }
    .stamp-row {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.35rem;
      margin-bottom: 0.85rem;
    }
    .stamp-row button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(8, 14, 16, 0.75);
      color: var(--ink);
      font: inherit;
      font-size: 0.62rem;
      padding: 0.45rem 0.2rem;
      cursor: pointer;
    }
    .stamp-row button.is-on {
      border-color: var(--accent);
      color: var(--accent);
    }
    .actions {
      display: flex;
      gap: 0.45rem;
    }
    .actions button {
      appearance: none;
      flex: 1;
      border: 1px solid var(--line);
      background: rgba(8, 16, 14, 0.85);
      color: var(--ink);
      font: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.85rem 0.6rem;
      cursor: pointer;
    }
    .actions .primary {
      border-color: rgba(61, 207, 122, 0.55);
      background: rgba(61, 207, 122, 0.14);
      color: var(--ok);
    }
    #status {
      margin-top: 0.75rem;
      min-height: 1.1rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    #status.ok { color: var(--ok); }
    #status.err { color: #ff7a7a; }
    .wall {
      margin-top: 1.4rem;
      border-top: 1px dashed var(--line);
      padding-top: 1rem;
    }
    .wall h2 {
      margin: 0 0 0.75rem;
      font-family: Syne, sans-serif;
      font-size: 1rem;
    }
    .note {
      position: relative;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(30, 24, 18, 0.92), rgba(10, 16, 18, 0.9));
      padding: 0.75rem 0.8rem 0.7rem;
      margin-bottom: 0.65rem;
      transform: rotate(var(--rot, 0deg));
    }
    .note .to {
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 0.25rem;
    }
    .note .to.team { color: var(--accent); }
    .note p {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .note .stamp {
      position: absolute;
      right: 0.45rem;
      top: 0.35rem;
      font-size: 1.35rem;
      opacity: 0.85;
      transform: rotate(12deg);
    }
    .note time {
      display: block;
      margin-top: 0.4rem;
      font-size: 0.58rem;
      color: var(--muted);
    }
    .empty { color: var(--muted); font-size: 0.78rem; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <h1>Feedback Board</h1>
      <a href="index.html">← Dashboard</a>
    </div>
    <p class="lead">Anonym an Agenten oder an <b>We Agents</b>. Emojis rein, Stempel drauf, absenden.</p>
    <div class="anon-badge">🕵️ anonym · niemand sieht wer</div>

    <div class="targets" id="targets"></div>

    <label>
      Nachricht
      <textarea id="text" maxlength="500" placeholder="Hey Team… / ROTA du rockst…"></textarea>
    </label>

    <div class="emoji-bar" id="emojis" aria-label="Emojis einfügen"></div>

    <label>Stempel-Grafik</label>
    <div class="stamp-row" id="stamps"></div>

    <div class="actions">
      <button type="button" class="primary" id="send">Anonym senden</button>
      <button type="button" id="refresh">Board</button>
    </div>
    <p id="status"></p>

    <section class="wall">
      <h2>Wand · live</h2>
      <div id="feed"></div>
    </section>
  </main>

  <script>
    (() => {
      const TARGETS = [
        { id: "TEAM", label: "We Agents", sub: "チーム" },
        { id: "ROTA", label: "ROTA", sub: "Lotta" },
        { id: "ANDŌ", label: "ANDŌ", sub: "Andrin" },
        { id: "YUSTO", label: "YUSTO", sub: "Justus" },
        { id: "YAN", label: "YAN", sub: "Jan" },
      ];
      const EMOJIS = [
        "😂","🔥","✨","🫡","🫶","🍜","🍣","🚃","🗼","🦊",
        "🐱","👻","🚀","💥","😎","🤩","😅","💪","🌀","🪩",
        "🌸","⚡","🍕","🎮","📸","🧃","💤","🎯","🏆","👽",
      ];
      const STAMPS = [
        { id: "zap", icon: "⚡" },
        { id: "heart", icon: "💖" },
        { id: "star", icon: "⭐" },
        { id: "rocket", icon: "🚀" },
        { id: "ramen", icon: "🍜" },
        { id: "ghost", icon: "👻" },
        { id: "cat", icon: "🐱" },
        { id: "spark", icon: "✨" },
        { id: "wave", icon: "🌊" },
        { id: "lol", icon: "😂" },
      ];

      const qs = new URLSearchParams(location.search);
      let target = (qs.get("to") || qs.get("target") || "TEAM").toUpperCase();
      if (target === "ANDO") target = "ANDŌ";
      if (!TARGETS.some((t) => t.id === target)) target = "TEAM";
      let stamp = "spark";

      const textEl = document.getElementById("text");
      const statusEl = document.getElementById("status");
      const feedEl = document.getElementById("feed");

      function setStatus(msg, kind) {
        statusEl.textContent = msg || "";
        statusEl.className = kind || "";
      }

      function renderTargets() {
        const el = document.getElementById("targets");
        el.innerHTML = TARGETS.map(
          (t) => `
          <button type="button" data-target="${t.id}" class="${t.id === target ? "is-on" : ""}">
            <b>${t.label}</b><span>${t.sub}</span>
          </button>`
        ).join("");
        el.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            target = btn.dataset.target;
            history.replaceState(null, "", `?to=${encodeURIComponent(target)}`);
            renderTargets();
            loadFeed();
          });
        });
      }

      document.getElementById("emojis").innerHTML = EMOJIS.map(
        (e) => `<button type="button" data-e="${e}">${e}</button>`
      ).join("");
      document.getElementById("emojis").addEventListener("click", (ev) => {
        const btn = ev.target.closest("button[data-e]");
        if (!btn) return;
        const start = textEl.selectionStart ?? textEl.value.length;
        const end = textEl.selectionEnd ?? start;
        const v = textEl.value;
        textEl.value = v.slice(0, start) + btn.dataset.e + v.slice(end);
        textEl.focus();
        const pos = start + btn.dataset.e.length;
        textEl.setSelectionRange(pos, pos);
      });

      function renderStamps() {
        const el = document.getElementById("stamps");
        el.innerHTML = STAMPS.map(
          (s) => `
          <button type="button" data-stamp="${s.id}" class="${s.id === stamp ? "is-on" : ""}" title="${s.id}">
            ${s.icon}
          </button>`
        ).join("");
        el.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            stamp = btn.dataset.stamp;
            renderStamps();
          });
        });
      }

      function stampIcon(id) {
        return (STAMPS.find((s) => s.id === id) || STAMPS[0]).icon;
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      async function loadFeed() {
        feedEl.innerHTML = `<p class="empty">Lade…</p>`;
        try {
          const q = target === "TEAM" ? "" : `?target=${encodeURIComponent(target)}`;
          // Wand zeigt alles wenn TEAM, sonst gefiltert — bei TEAM alle Posts
          const url = target === "TEAM" ? "/api/feedback?limit=60" : `/api/feedback?target=${encodeURIComponent(target)}&limit=60`;
          const res = await fetch(url, { cache: "no-store" });
          const data = await res.json();
          const posts = data.posts || [];
          if (!posts.length) {
            feedEl.innerHTML = `<p class="empty">Noch leer — sei der erste 👻</p>`;
            return;
          }
          feedEl.innerHTML = posts
            .map((p) => {
              const rot = ((p.rotate || 0) % 7) - 3;
              const team = p.target === "TEAM";
              return `
              <article class="note" style="--rot:${rot}deg">
                <div class="stamp">${stampIcon(p.stamp)}</div>
                <div class="to${team ? " team" : ""}">→ ${escapeHtml(p.target)}</div>
                <p>${escapeHtml(p.text)}</p>
                <time>${new Date(p.created_at).toLocaleString("de-CH", { dateStyle: "short", timeStyle: "short" })}</time>
              </article>`;
            })
            .join("");
        } catch {
          feedEl.innerHTML = `<p class="empty">Laden fehlgeschlagen</p>`;
        }
      }

      document.getElementById("send").addEventListener("click", async () => {
        const text = textEl.value.trim();
        if (!text) {
          setStatus("Text fehlt", "err");
          return;
        }
        setStatus("Sende anonym…");
        try {
          const res = await fetch("/api/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              target,
              text,
              stamp,
              rotate: Math.floor(Math.random() * 11) - 5,
            }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.error || "Fehler");
          textEl.value = "";
          setStatus("Dran — anonym gepostet", "ok");
          await loadFeed();
        } catch (err) {
          setStatus(err.message || String(err), "err");
        }
      });

      document.getElementById("refresh").addEventListener("click", loadFeed);

      renderTargets();
      renderStamps();
      loadFeed();
    })();
  </script>
</body>
</html>
